<h3>Quick Contact Form</h3>
<form onsubmit="return validateContactForm(event)" novalidate>
  <div class="form-group"><label for="cName">Name *</label>
  <input id="cName" required>
  <div class="error" id="nameError"></div>
  </div>
  <div class="form-group"><label for="cEmail">Email *</label>
 <input id="cEmail" type="email" required><div class="error" id="emailError"></div></div>
  <div class="form-group"><label for="cMessage">Message *</label>
    <textarea id="cMessage" rows="5" required></textarea>
    <div class="error" id="msgError"></div>
</div>
  <button type="submit" class="btn">Send Message</button>
</form>
